# docker-compose.yml — local development services
# Provides Postgres and Azurite for local dev/testing

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: credenviel
      POSTGRES_USER: credenviel
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"  # Blob
      - "10001:10001"  # Queue
      - "10002:10002"  # Table
    volumes:
      - azdata:/data

volumes:
  pgdata:
  azdata:
